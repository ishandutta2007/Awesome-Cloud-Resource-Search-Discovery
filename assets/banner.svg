<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
      
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.05); opacity: 0.7; }
        100% { transform: scale(0.95); opacity: 0.3; }
      }
      
      .floating-node1 { animation: float1 6s ease-in-out infinite; }
      .floating-node2 { animation: float2 8s ease-in-out infinite; }
      .pulsing-grid { animation: pulse-ring 4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Background Grid & Network Elements (Behind Text) -->
  <g class="pulsing-grid" opacity="0.25">
    <circle cx="200" cy="100" r="180" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="1000" cy="300" r="220" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="100" y1="50" x2="1100" y2="350" stroke="#818cf8" stroke-width="1" stroke-dasharray="5 10"/>
    <line x1="150" y1="350" x2="1050" y2="50" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5 10"/>
  </g>

  <!-- Decorative Network Nodes in Background -->
  <g class="floating-node1" opacity="0.4">
    <circle cx="150" cy="80" r="6" fill="#38bdf8"/>
    <circle cx="1050" cy="120" r="8" fill="#c084fc"/>
    <line x1="150" y1="80" x2="250" y2="140" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  
  <g class="floating-node2" opacity="0.4">
    <circle cx="980" cy="320" r="7" fill="#818cf8"/>
    <circle cx="200" cy="310" r="5" fill="#38bdf8"/>
    <line x1="980" y1="320" x2="880" y2="250" stroke="#818cf8" stroke-width="1.5"/>
  </g>

  <!-- Title & Foreground Content Container (Guaranteed Top Layer & Unobscured) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Icon / Tag Pill -->
    <rect x="-180" y="-95" width="360" height="36" rx="18" fill="url(#card-grad)" stroke="url(#accent-grad)" stroke-width="1.5"/>
    <text x="0" y="-72" class="badge-text" text-anchor="middle">☁️ MULTI-CLOUD ASSET DISCOVERY &amp; SEARCH 🔎</text>

    <!-- Main Title -->
    <text x="0" y="-5" class="title" filter="url(#glow)">Awesome Cloud Resource Search</text>
    <text x="0" y="45" class="title" fill="url(#accent-grad)">&amp; Discovery Engine</text>

    <!-- Subtitle -->
    <text x="0" y="100" class="subtitle">Curated Commercial Platforms, Graph Query Engines &amp; Open-Source Inventories</text>
  </g>

  <!-- Bottom Decorative Tech Pill Bar -->
  <g transform="translate(600, 340)" text-anchor="middle">
    <rect x="-320" y="-18" width="640" height="36" rx="18" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
      ⚡ AWS Resource Explorer &nbsp;|&nbsp; 🪐 Cartography &nbsp;|&nbsp; 📦 CloudQuery &nbsp;|&nbsp; 🔗 Steampipe &nbsp;|&nbsp; 🟣 Wiz
    </text>
  </g>
</svg>
