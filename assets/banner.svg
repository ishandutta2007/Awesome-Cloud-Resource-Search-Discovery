<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    
    /* Dynamic Animations in background/around elements */
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .float-item {
      animation: float 6s ease-in-out infinite alternate;
    }
    .float-item-delayed {
      animation: float 7s ease-in-out infinite 1s alternate;
    }
    .dash-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.4; }
      100% { transform: scale(1.05); opacity: 0.8; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }

    /* Foreground Typography */
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .node-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Canvas Base -->
  <rect width="1200" height="400" class="bg" rx="16" />

  <!-- Background Decorative Grid & Nodes (Low opacity to keep text clear) -->
  <g opacity="0.15">
    <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300" stroke="#64748b" stroke-width="1" />
    <path d="M 200 0 L 200 400 M 400 0 L 400 400 M 600 0 L 600 400 M 800 0 L 800 400 M 1000 0 L 1000 400" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Ambient Glowing Blobs in Background (Behind Text) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad)" class="pulse-circle" />
  <circle cx="1000" cy="300" r="220" fill="url(#glowGrad)" class="pulse-circle" />

  <!-- Side Dynamic Visual Elements (Positioned safely away from text center/left) -->
  
  <!-- Right Side Visual: Cloud Resource Graph Mesh (Safe Zone: X > 820) -->
  <g transform="translate(850, 80)">
    <!-- Animated Connecting Network Lines -->
    <path d="M 120 60 L 220 130 M 120 60 L 70 180 M 220 130 L 170 240 M 70 180 L 170 240 M 220 130 L 260 220" stroke="#38bdf8" stroke-width="2" class="dash-line" opacity="0.7" />
    
    <!-- Floating Node 1 (AWS/Cloud Resource) -->
    <g class="float-item" transform="translate(120, 60)">
      <circle r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
      <path d="M-10 -5 L0 -15 L10 -5 L5 -5 L5 10 L-5 10 L-5 -5 Z" fill="#38bdf8" />
      <text y="48" text-anchor="middle" class="node-text">AWS EC2</text>
    </g>

    <!-- Floating Node 2 (Azure/Database) -->
    <g class="float-item-delayed" transform="translate(220, 130)">
      <circle r="26" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)" />
      <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#8b5cf6" />
      <text y="44" text-anchor="middle" class="node-text">Azure SQL</text>
    </g>

    <!-- Floating Node 3 (K8s Cluster) -->
    <g class="float-item" transform="translate(70, 180)">
      <circle r="28" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
      <polygon points="0,-12 10,-5 10,7 0,13 -10,7 -10,-5" fill="#06b6d4" />
      <text y="44" text-anchor="middle" class="node-text">Kubernetes</text>
    </g>

    <!-- Floating Node 4 (GCP Bucket) -->
    <g class="float-item-delayed" transform="translate(170, 240)">
      <circle r="25" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
      <ellipse cx="0" cy="-4" rx="10" ry="4" fill="#f59e0b" />
      <path d="M-10 -4 v8 c0 2.2 4.5 4 10 4 s10 -1.8 10 -4 v-8" fill="none" stroke="#f59e0b" stroke-width="1.5" />
      <text y="42" text-anchor="middle" class="node-text">GCP Storage</text>
    </g>
  </g>

  <!-- Left Side Subtle Accent Pillar (Safe Zone: X < 70) -->
  <g transform="translate(50, 0)">
    <line x1="0" y1="0" x2="0" y2="400" stroke="url(#cyanPurple)" stroke-width="3" opacity="0.4" />
  </g>

  <!-- FOREGROUND CONTENT ZONE (Guaranteed unobstructed: X=90 to 800, Y=100 to 320) -->
  <g transform="translate(90, 0)">
    
    <!-- Top Pill / Tagline -->
    <g transform="translate(0, 105)">
      <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="21" class="badge-text">MULTI-CLOUD DISCOVERY &amp; ASSET SEARCH</text>
    </g>

    <!-- Main Title (Stays cleanly in foreground) -->
    <text x="0" y="195" class="title">
      Awesome Cloud Resource
    </text>
    <text x="0" y="250" class="title" fill="url(#cyanPurple)">
      Search &amp; Discovery 🔎 ☁️
    </text>

    <!-- Subtitle (Clear and unobstructed) -->
    <text x="0" y="298" class="subtitle">
      Curated directory of CAASM, Cloud Inventory, SQL Queries &amp; Relationship Graph tools.
    </text>

    <!-- Feature Chips at bottom of content zone -->
    <g transform="translate(0, 325)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="52" y="17" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AWS / GCP / Azure</text>

      <!-- Chip 2 -->
      <rect x="115" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="167" y="17" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Open Source SQL</text>

      <!-- Chip 3 -->
      <rect x="230" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="287" y="17" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Graph &amp; IAM Mapping</text>
    </g>

  </g>
</svg>
