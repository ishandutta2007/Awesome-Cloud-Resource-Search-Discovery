peatCount="indefinite" values="0.3;1;0.3"/></circle><text x="36" y="21" class="badge-text">MULTI-CLOUD DISCOVERY &amp; ASSET SEARCH</text></g><text x="0" y="195" class="title" transform="translate(90, 0)">Awesome Cloud Resource</text><text x="0" y="250" fill="url(#cyanPurple)" class="title" transform="translate(90, 0)">Search &amp; Discovery 🔎 ☁️</text><text x="0" y="298" class="subtitle" transform="translate(90, 0)">Curated directory of CAASM, Cloud Inventory, SQL Queries &amp; Relationship Graph tools.</text><g transform="translate(90, 0) translate(0, 325)"><rect width="105" height="26" x="0" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="52" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">AWS / GCP / Azure</text><rect width="105" height="26" x="115" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="167" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Open Source SQL</text><rect width="115" height="26" x="230" y="0" fill="#1e293b" stroke="#334155" rx="6"/><text x="287" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Graph &amp; IAM Mapping</text></g></g></svg>